# 抓取流程 3：反向对角搬运。
# A3 位于右前方偏右（J1 -56.9°），B3 位于右前方偏左（J1 +25.6°）。
# 两点半径均保留在稳定可达区，82.5° 的反向转动与流程 1/2 方向相反。
grasp_task3:
  ros__parameters:
    use_sim_time: true

    # 机械臂底座在世界坐标系的位姿（launch 里生成机器人的位置，须一致）
    base_pose_xyz: [0.0, 0.0, 0.75]

    # 取物点 A / 放置点 B（世界坐标，物体中心）。A 必须与 world 文件里
    # target_object 的初始位姿一致。
    point_a: [0.075, -0.115, 0.7635]
    point_b: [0.125, 0.060, 0.7635]

    # 安全高度：取放过程中工具中心离桌面的抬升高度（m）
    safe_height: 0.05

    # 工具参数：夹持中心相对 gripper_base 原点沿接近轴的距离（m）
    tool_tip_offset: 0.063

    # 夹爪开/合角度（官方 adaptive gripper，rad）
    gripper_open: 0.0
    gripper_close: -0.44

    # 运动节奏（s）：单段轨迹时长与夹爪动作时长
    move_duration: 2.5
    grip_duration: 1.2

    # 连续抓取次数（验收：5 次至少成功 4 次）
    cycles: 5

    # 使用独立目录，避免覆盖流程 1/2 的运行证据
    log_dir: "~/grasp_logs3"

    # 必须与 theWorld3.sdf 的世界名一致
    world_name: "grasp_world3"

    # 纯物理抓取：接触 + 摩擦，不启用仿真吸附
    sim_attach: false
    # 仿真结果判定/复位用 Gazebo 位姿真值；真机上改 false
    sim_check: true